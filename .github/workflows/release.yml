name: Release

# Wird ausgelöst, sobald ein Tag im Format "v1.2.3" gepusht wird.
# Ablauf zum Veröffentlichen einer neuen Version:
#   1. <Version> in "Serial Manager/Serial Manager.csproj" anpassen
#      (rein informativ, siehe Schritt "Anwendung veröffentlichen" unten)
#   2. git commit
#   3. git tag v1.2.3
#   4. git push origin main --tags
# Dieser Workflow baut die Anwendung und verpackt sie mit Inno Setup zu
# einem klassischen Windows-Installer (SerialManagerSetup.exe), der nach
# "C:\Program Files\SerialManager" installiert (Administratorrechte
# erforderlich) - und veröffentlicht ihn automatisch als GitHub Release.
#
# Hinweis zum Umstieg weg von Velopack: Velopack installierte bewusst PRO
# BENUTZER ohne Admin-Rechte unter %LocalAppData%, damit es sich selbst im
# Hintergrund aktualisieren konnte. Ein echtes "C:\Program Files"-Setup
# braucht dagegen zwingend Administratorrechte - auch für Updates (siehe
# Services/UpdateService.cs, das den Installer mit einem UAC-Dialog
# erneut aufruft). Das ist der bewusst in Kauf genommene Kompromiss für
# eine "normale" Installation wie bei den meisten anderen Windows-
# Anwendungen.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version aus Tag ermitteln
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: .NET SDK installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Anwendung veröffentlichen (dotnet publish)
        run: >
          dotnet publish "Serial Manager/Serial Manager.csproj"
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Optional: Code-Signing-Zertifikat. Erst aktiv, wenn die Secrets
      # WINDOWS_CERTIFICATE_BASE64 (Base64-codierte .pfx-Datei) und
      # WINDOWS_CERTIFICATE_PASSWORD im Repo hinterlegt sind (Settings ->
      # Secrets and variables -> Actions). Ohne diese Secrets läuft der
      # Workflow unverändert weiter - nur eben unsigniert. Siehe README.md
      # für Optionen/Kosten (z. B. Azure Trusted Signing, ~10 $/Monat).
      - name: Code-Signing-Zertifikat vorbereiten
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}" | base64 --decode > cert.pfx

      - name: Installer mit Inno Setup bauen
        shell: pwsh
        run: |
          $publishDir = Join-Path (Get-Location) "publish"
          $releaseDir = Join-Path (Get-Location) "build\Releases"

          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
              "build\installer.iss" `
              "/DMyAppVersion=${{ steps.version.outputs.version }}" `
              "/DPublishDir=$publishDir" `
              "/DOutputDir=$releaseDir"

          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe (Inno Setup) ist fehlgeschlagen." }

      - name: Installer signieren
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $setupExe = Join-Path (Get-Location) "build\Releases\SerialManagerSetup.exe"

          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
                          -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match "\\x64\\" } |
                      Select-Object -First 1

          if (-not $signtool) { throw "signtool.exe wurde nicht gefunden." }

          $signProcess = Start-Process -FilePath $signtool.FullName `
              -ArgumentList "sign /f cert.pfx /p `"${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}`" /tr http://timestamp.digicert.com /td sha256 /fd sha256 `"$setupExe`"" `
              -NoNewWindow -Wait -PassThru

          if ($signProcess.ExitCode -ne 0) { throw "signtool.exe (Signieren) ist fehlgeschlagen." }

      - name: Release auf GitHub veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "build/Releases/SerialManagerSetup.exe" \
            --repo "${{ github.repository }}" \
            --title "Serial Manager ${{ steps.version.outputs.version }}" \
            --notes "Serial Manager ${{ steps.version.outputs.version }}"
