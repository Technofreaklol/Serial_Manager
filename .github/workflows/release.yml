name: Release

# Wird ausgelöst, sobald ein Tag im Format "v1.2.3" gepusht wird.
# Ablauf zum Veröffentlichen einer neuen Version:
#   1. <Version> in "Serial Manager/Serial Manager.csproj" anpassen
#      (rein informativ, siehe Schritt "Anwendung veröffentlichen" unten)
#   2. git commit
#   3. git tag v1.2.3
#   4. git push origin main --tags
# Dieser Workflow baut die Anwendung, verpackt sie mit Velopack (vpk)
# zu einem Windows-Installer + Update-Paketen und veröffentlicht sie
# automatisch als GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Version aus Tag ermitteln
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: .NET SDK installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Anwendung veröffentlichen (dotnet publish)
        run: >
          dotnet publish "Serial Manager/Serial Manager.csproj"
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # Alles rund um vpk läuft bewusst in EINEM einzigen bash-Schritt
      # (statt über mehrere Schritte verteilt): "dotnet tool install -g"
      # aktualisiert nur die PERSISTIERTE PATH-Variable für zukünftige
      # Shells, nicht die der aktuell laufenden. Jeder Workflow-Schritt
      # startet aber eine neue Shell - über $GITHUB_PATH hinzugefügte
      # Einträge sollten dort zwar automatisch verfügbar sein, das hat
      # sich in der Praxis auf windows-latest aber nicht zuverlässig
      # gezeigt. Deshalb zusätzlich als Absicherung: PATH innerhalb
      # dieses einen Schritts explizit selbst erweitern.
      - name: vpk-CLI installieren
        shell: bash
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Optional: Code-Signing-Zertifikat. Erst aktiv, wenn die Secrets
      # WINDOWS_CERTIFICATE_BASE64 (Base64-codierte .pfx-Datei) und
      # WINDOWS_CERTIFICATE_PASSWORD im Repo hinterlegt sind (Settings ->
      # Secrets and variables -> Actions). Ohne diese Secrets läuft der
      # Workflow unverändert weiter - nur eben unsigniert. Siehe README.md
      # für Optionen/Kosten (z. B. Azure Trusted Signing, ~10 $/Monat).
      - name: Code-Signing-Zertifikat vorbereiten
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}" | base64 --decode > cert.pfx

      - name: Installer, Update-Pakete erstellen und veröffentlichen
        shell: bash
        env:
          HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        run: |
          # Absicherung, falls $GITHUB_PATH aus dem vorherigen Schritt aus
          # irgendeinem Grund nicht greift:
          export PATH="$PATH:$HOME/.dotnet/tools"

          if ! command -v vpk >/dev/null 2>&1; then
            echo "::error::vpk wurde nicht im PATH gefunden ($HOME/.dotnet/tools)."
            exit 1
          fi

          # Vorherige Releases laden (für Delta-Updates). Beim allerersten
          # Release gibt es noch nichts zu laden - kein Fehler.
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" || true

          SIGN_ARGS=()
          if [ "$HAS_CERT" = "true" ]; then
            SIGN_ARGS=(--signParams "/f cert.pfx /p \"${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}\" /tr http://timestamp.digicert.com /td sha256 /fd sha256")
          fi

          vpk pack \
            --packId "SerialManager" \
            --packVersion "${{ steps.version.outputs.version }}" \
            --packDir publish \
            --mainExe "SerialManager.exe" \
            --packTitle "Serial Manager" \
            --packAuthors "Nikolai Hieber" \
            --icon "Serial Manager/Assets/Logo.ico" \
            "${SIGN_ARGS[@]}"

          vpk upload github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --publish \
            --releaseName "Serial Manager ${{ steps.version.outputs.version }}" \
            --tag "v${{ steps.version.outputs.version }}"
